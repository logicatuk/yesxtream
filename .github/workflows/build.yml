# Reusable build workflow for all platforms
name: Build All Platforms

on:
  workflow_call:
    inputs:
      release_tag:
        description: 'Tag name for the release'
        required: true
        type: string
      release_name:
        description: 'Display name for the release'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: true

jobs:
  # ─── Android ────────────────────────────────────────────────────────
  build-android:
    name: Android (APK + AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  # ─── iOS ────────────────────────────────────────────────────────────
  build-ios:
    name: iOS (IPA)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Create unsigned IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r *.app Payload/
          zip -r YesXtream-ios-unsigned.ipa Payload
          cp YesXtream-ios-unsigned.ipa clubtivi-ios-unsigned.ipa || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            build/ios/iphoneos/YesXtream-ios-unsigned.ipa
            build/ios/iphoneos/clubtivi-ios-unsigned.ipa

  # ─── macOS ──────────────────────────────────────────────────────────
  build-macos:
    name: macOS (DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Create DMG
        run: |
          APP_PATH=$(find build/macos/Build/Products/Release -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Error: macOS .app bundle not found in build/macos/Build/Products/Release"
            ls -la build/macos/Build/Products/Release || true
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          hdiutil create -volname "YesXtream" -srcfolder "$APP_PATH" -ov -format UDZO YesXtream-macos.dmg
          cp YesXtream-macos.dmg clubtivi-macos.dmg || true

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            YesXtream-macos.dmg
            clubtivi-macos.dmg

  # ─── Windows ────────────────────────────────────────────────────────
  build-windows:
    name: Windows (ZIP)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Create ZIP
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "YesXtream-windows.zip"
          Copy-Item "YesXtream-windows.zip" "clubtivi-windows.zip" -ErrorAction SilentlyContinue

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: |
            YesXtream-windows.zip
            clubtivi-windows.zip

  # ─── Linux ──────────────────────────────────────────────────────────
  build-linux:
    name: Linux (tar.gz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Create tarball
        run: |
          cd build/linux/x64/release
          tar czf ../../../../YesXtream-linux-x64.tar.gz bundle/
          cd ../../../..
          cp YesXtream-linux-x64.tar.gz clubtivi-linux-x64.tar.gz || true

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: |
            YesXtream-linux-x64.tar.gz
            clubtivi-linux-x64.tar.gz

  # ─── Create Release ────────────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    needs: [build-android, build-ios, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          # Android
          find artifacts/android-apk -name "*.apk" -exec cp {} release/YesXtream-android.apk \;
          find artifacts/android-aab -name "*.aab" -exec cp {} release/YesXtream-android.aab \;
          # iOS
          find artifacts/ios-ipa -name "*.ipa" -exec cp {} release/YesXtream-ios-unsigned.ipa \;
          # macOS
          find artifacts/macos-dmg -name "*.dmg" -exec cp {} release/YesXtream-macos.dmg \;
          # Windows
          find artifacts/windows-zip -name "*.zip" -exec cp {} release/YesXtream-windows.zip \;
          # Linux
          find artifacts/linux-tar -name "*.tar.gz" -exec cp {} release/YesXtream-linux-x64.tar.gz \;
          ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: ${{ inputs.release_name }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: release/*
