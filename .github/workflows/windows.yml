name: Build Windows Direct EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build YesXtream-Setup.exe
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter Windows Release
        run: flutter build windows --release

      - name: Compile Inno Setup Direct Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer/yesxtream.iss

      - name: Upload Direct Setup EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YesXtream-Windows-Setup-EXE
          path: build/windows-installer/YesXtream-Setup.exe
          retention-days: 14

      - name: Create GitHub Release with Direct EXE
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: build/windows-installer/YesXtream-Setup.exe
          tag_name: windows-latest
          name: "YesXtream Windows Direct Installer"
          body: "Direct standalone installer for Windows 10 & 11 (64-bit). Double-click YesXtream-Setup.exe to install and run."
          draft: false
          prerelease: false
